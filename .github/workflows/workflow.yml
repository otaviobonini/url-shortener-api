name: Continuous Integration
on: [push, pull_request]
jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: "test-secret"
      DATABASE_URL: "postgresql://user:pass@localhost:5434/test"
      CLIENT_URL: "http://localhost:3000"
      APP_URL: "http://localhost:3000"
      NODE_ENV: "test"
      PORT: "5001"
      REDIS_URL: "redis://localhost:6379"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Runs Prisma generate
        run: npx prisma generate

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t url-shortener-api:ci .

  deploy:
    # Only deploy when the CI job passes, on the main branch, and on push events to main (not PRs)
    needs: continuous-integration
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy na EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: url-api.otaviobonini.dev
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/url-shortener-api
            git pull --ff-only
            docker compose -f docker-compose.prod.yml up -d --build
            sleep 10
            curl -fsS localhost:5001/health
            docker image prune -f